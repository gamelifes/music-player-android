distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用 -all 发行版：它自带 Gradle 源码，Android Studio 就不用再去
# services.gradle.org 单独下载 gradle-*-src.zip（那个地址在很多网络下连不上，
# 会导致 prepareKotlinBuildScriptModel 报 "Failed to transform gradle-8.10.2-src.zip"）。
#
# 下面用的是本机已下载好的 -all 包，所以完全离线。
# 换到能直连的环境时，把这一行改回官方地址即可：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
distributionUrl=file\:/D:/gradle/.gradle/wrapper/dists/gradle-8.11.1-all.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
